# AI Eyes Vision Assistant Configuration

# Model Configuration
model:
  name: "yolov5s"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"  # cpu or cuda
  fp16: false
  max_detections: 10

# Language Configuration  
language:
  output: "vi"  # Vietnamese
  tts: "vi"
  ocr: ["vi", "en"]

# Processing Configuration
processing:
  process_every_n_frames: 2
  enable_ocr: true
  enable_speech: true
  enable_color_recognition: true
  enable_distance_estimation: true

# Distance Estimation Thresholds
distance:
  very_close_threshold: 0.8  # Bottom of bbox at 80% of frame height
  close_threshold: 0.6       # Bottom of bbox at 60% of frame height  
  medium_threshold: 0.4      # Bottom of bbox at 40% of frame height
  far_threshold: 0.2         # Bottom of bbox at 20% of frame height

# Speech Configuration
speech:
  mode: "auto"                  # auto mode with gTTS primary, pyttsx3 fallback
  engine: "gtts"                # gTTS primary engine
  fallback: "pyttsx3"           # offline fallback for network issues
  mock: false                   # LOCKED: false - force real audio output
  mute: false                   # LOCKED: false - enable audio by default
  legacy: false                 # LOCKED: false - disable legacy mode
  lang: "vi"                    # Vietnamese language
  min_gap_secs: 1.0             # minimum gap between any two speeches
  repeat_same_after_secs: 4.0   # repeat same sentence after this interval
  min_interval_ms: 1800         # INCREASED: throttle between utterances (was 1200)
  dedupe_window_ms: 3500        # INCREASED: suppress near-duplicates (was 2500)
  force_vi: true                # enforce Vietnamese-only content at TTS boundary
  test_phrase_vi: "Xin chào, đây là tiếng Việt."
  auto_unmute_on_start: true    # automatically enable speech when camera starts
  rate: 190
  volume: 1.0                   # LOCKED: full volume for Windows audio
  dedupe_seconds: 3.0
  voice_id: null
  # Windows Audio Driver Configuration
  audio_driver: "wasapi"        # Primary: WASAPI (Windows 10/11)
  audio_fallback: "directsound" # Fallback: DirectSound if WASAPI fails
  # Temp file cleanup
  cleanup_temp_files: true      # Auto-delete temp MP3 files after playback

# TTS Configuration (legacy)
tts:
  mode: "online"        # online | offline | auto
  lang: "vi"
  offline_prefer_vi: true

# Camera Configuration
camera:
  width: 640
  height: 480
  fps: 30
  index: 0
  prefer_backends: ["DSHOW", "MSMF"]  # Windows preferred backends
  prefer_codecs: ["MJPG", "YUY2", "NONE"]  # Preferred codec order

# Region Definitions (relative coordinates 0-1)
regions:
  front:
    x1: 0.2
    y1: 0.2  
    x2: 0.8
    y2: 0.8
  left:
    x1: 0.0
    y1: 0.0
    x2: 0.4
    y2: 1.0
  right: 
    x1: 0.6
    y1: 0.0
    x2: 1.0
    y2: 1.0
  center:
    x1: 0.25
    y1: 0.25
    x2: 0.75
    y2: 0.75
  full:
    x1: 0.0
    y1: 0.0
    x2: 1.0
    y2: 1.0

# Performance Settings
performance:
  max_fps: 30
  threading: true
  background_speech: true
